<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>HouseHero — משימות ותגמולים לבית</title>
    <meta name="description" content="ניהול משימות בית משותף עם נקודות ותגמולים." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="theme-color" content="#5b4fc4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#100e1f" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <script>
      // Applies the saved language before the first paint. Without this the
      // page renders in the markup's direction and then flips once React
      // loads, which is a visible jolt on a slow phone.
      try {
        var saved = localStorage.getItem('househero.language')
        var lang =
          saved === 'he' || saved === 'en'
            ? saved
            : (navigator.languages || [navigator.language]).some(function (tag) {
                return tag && tag.toLowerCase().indexOf('he') === 0
              })
              ? 'he'
              : 'en'
        document.documentElement.lang = lang
        document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr'
      } catch (error) {
        // Storage blocked; the markup's default stands and React corrects it.
      }
    </script>
    <script>
      // If one of the app's own files fails to load - say, a copy of the page
      // from before a deploy asking for files the deploy removed - load the
      // page again once, rather than leave a blank screen. Once per minute at
      // most, so a real outage cannot turn into a reload loop.
      window.__househeroRecover = function () {
        try {
          var last = Number(sessionStorage.getItem('househero.recoveredAt') || 0)
          if (Date.now() - last < 60000) return false
          sessionStorage.setItem('househero.recoveredAt', String(Date.now()))
        } catch (error) {
          return false
        }
        location.reload()
        return true
      }
      window.addEventListener(
        'error',
        function (event) {
          var el = event.target
          var src = el && (el.src || el.href)
          if (src && (el.tagName === 'SCRIPT' || el.tagName === 'LINK') && src.indexOf('/assets/') !== -1) {
            window.__househeroRecover()
          }
        },
        true,
      )
      // Vite's signal that a file a screen needs could not be loaded.
      window.addEventListener('vite:preloadError', function () {
        window.__househeroRecover()
      })
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
