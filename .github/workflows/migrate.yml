name: Apply Supabase migration

# Runs every supabase/migrations/NNNN_*.sql file, in order, against the live
# database whenever one changes on main. Each one is written to be safely
# re-run, on its own or as part of the whole set - none of them drop existing
# data, only recreate their own tables/functions/policies - so applying them
# automatically here is exactly as safe as pasting them into the Supabase SQL
# Editor by hand, in the same order, just without the manual step. They are
# always applied together, in filename order, every time any of them changes -
# there is no per-file "already applied" tracking.
#
# This exists because the environment that edits this repo cannot reach
# Supabase's database or management API directly - only a small fixed
# allowlist of hosts is reachable from there. GitHub-hosted runners have no
# such restriction, so the migration runs here instead.
#
# The two PASTE_... placeholders live only in 0001_init.sql, and are never
# filled in here with a text edit - they are substituted into a scratch copy
# from repository secrets, at run time, and the substituted copy is discarded
# when the job ends. The committed file itself must always keep saying
# PASTE_PROJECT_REF_HERE and PASTE_VAPID_PRIVATE_KEY_HERE - that is also what
# lets the same file still work for someone who prefers to paste it into the
# Supabase SQL Editor by hand and fill those two lines in themselves.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check credentials
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$PROJECT_REF" ] || [ -z "$VAPID_PRIVATE_KEY" ]; then
            echo "::error::Set SUPABASE_DB_URL, SUPABASE_PROJECT_REF and VAPID_PRIVATE_KEY as repository secrets. See SETUP.md."
            exit 1
          fi

      - name: Install postgresql-client
        run: sudo apt-get update -y -qq && sudo apt-get install -y -qq --no-install-recommends postgresql-client

      - name: Substitute secrets into a scratch copy
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/migrations"
          for file in supabase/migrations/*.sql; do
            sed \
              -e "s|PASTE_PROJECT_REF_HERE|${PROJECT_REF}|" \
              -e "s|PASTE_VAPID_PRIVATE_KEY_HERE|${VAPID_PRIVATE_KEY}|" \
              "$file" > "$RUNNER_TEMP/migrations/$(basename "$file")"
          done

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Sorted by filename, so 0001 always runs before 0002 and 0003.
          for file in "$RUNNER_TEMP"/migrations/*.sql; do
            echo "::group::$(basename "$file")"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
            echo "::endgroup::"
          done
